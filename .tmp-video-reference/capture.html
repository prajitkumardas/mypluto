<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #080817; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #080817; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1512" height="811"></canvas>
  <video id="video" src="file:///C:/Users/ASUS/Downloads/Rebuild_existing_hero_motion_sec%E2%80%A6_202608230140.mp4" muted playsinline preload="auto" style="display:none"></video>
  <script>
    const params = new URLSearchParams(location.search);
    const pct = Number(params.get('pct') || 0);
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function draw() {
      ctx.fillStyle = '#080817';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
      const w = video.videoWidth * scale;
      const h = video.videoHeight * scale;
      ctx.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      document.body.dataset.ready = 'true';
    }
    video.addEventListener('loadedmetadata', () => {
      video.currentTime = Math.max(0, Math.min(video.duration * pct, video.duration - 0.05));
    });
    video.addEventListener('seeked', draw);
    video.load();
  </script>
</body>
</html>
